name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install websocket-client

      - name: Shell size budget
        run: |
          bytes=$(cat index.html css/app.css js/*.js vendor/tone.min.js sw.js manifest.webmanifest | wc -c)
          echo "shell payload: $((bytes / 1024)) KB"
          if [ "$bytes" -gt 768000 ]; then
            echo "::error::The shell passed the 750 KB budget. This app stays fast because it stays small."
            exit 1
          fi

      - name: Locate Chrome
        run: |
          for b in /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$b" ]; then echo "CHROME_BIN=$b" >> "$GITHUB_ENV"; break; fi
          done
          echo "using ${CHROME_BIN:-none}"

      - name: Run the browser suite
        run: python3 tests/run_browser_tests.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/results.json
