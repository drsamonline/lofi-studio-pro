name: Android build

# Builds a debug APK from the web app with Capacitor. Nothing here is
# committed to the repo: a binary nobody rebuilt is worse than no binary.
# Trigger it by hand, or push a tag like v2.0.0 to attach the APK to a release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm install --no-audit --no-fund
          npx cap add android || true

      - name: Sync the web build into the native shell
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and upload
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/lofi-studio-pro-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lofi-studio-pro-apk
          path: out/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
