name: Android build

# Builds a debug APK from the web app with Capacitor. Nothing here is
# committed to the repo: a binary nobody rebuilt is worse than no binary.
# Trigger it by hand, or push a tag like v2.0.0 to attach the APK to a release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor
        run: npm install --no-audit --no-fund --omit=optional

      - name: Stage the web app
        run: sh scripts/build-web.sh

      - name: Create the native shell
        run: npx cap add android

      - name: Sync the web build into it
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/lofi-studio-pro-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lofi-studio-pro-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
