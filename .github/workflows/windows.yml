name: Windows build

# Builds a Windows .exe from the web app with Tauri. Tauri wraps the existing
# static files in the system WebView2, so the binary stays a few megabytes
# instead of shipping a whole browser engine.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund

      - name: Scaffold the Tauri shell (first run only)
        run: |
          if (!(Test-Path src-tauri)) {
            npx tauri init --app-name "Lofi Studio Pro" `
              --window-title "Lofi Studio Pro" `
              --frontend-dist "../dist" `
              --dev-url "http://localhost:8000" --ci
          }

      - name: Set the bundle identifier
        run: |
          $path = "src-tauri/tauri.conf.json"
          $c = Get-Content $path -Raw | ConvertFrom-Json
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $c.identifier = "com.drsamonline.lofistudio"
          $c.productName = "Lofi Studio Pro"
          $c.version = $version
          $c.build.frontendDist = "../dist"
          $c.build.beforeBuildCommand = "node scripts/stage.js"
          $c | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          Get-Content $path | Select-String -Pattern 'identifier|productName'

      - name: Build
        run: npx tauri build

      - name: Collect artefacts
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Get-ChildItem -Recurse -Include *-setup.exe,*.msi -Path src-tauri/target/release |
            Where-Object { $_.FullName -notmatch 'deps|build' } |
            ForEach-Object {
              $kind = if ($_.Extension -eq '.msi') { '.msi' } else { '-setup.exe' }
              Copy-Item $_.FullName -Destination "out/Lofi-Studio-Pro-$version-x64$kind"
            }
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: lofi-studio-pro-windows
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
